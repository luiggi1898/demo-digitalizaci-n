<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <rect width="1200" height="90" fill="#232f3e"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Amazon: de librería online a almacén robotizado</text>
  <text x="600" y="74" text-anchor="middle" font-size="17" fill="#ffb366">6 hitos de su evolución tecnológica (1994–2025)</text>

  <!-- Línea del tiempo -->
  <line x1="60" y1="360" x2="1140" y2="360" stroke="#232f3e" stroke-width="6" stroke-linecap="round"/>

  <!-- Conectores -->
  <g stroke="#8b95a1" stroke-width="2">
    <line x1="130" y1="300" x2="130" y2="346"/>
    <line x1="318" y1="374" x2="318" y2="420"/>
    <line x1="506" y1="300" x2="506" y2="346"/>
    <line x1="694" y1="374" x2="694" y2="420"/>
    <line x1="882" y1="300" x2="882" y2="346"/>
    <line x1="1070" y1="374" x2="1070" y2="420"/>
  </g>

  <!-- Puntos -->
  <g stroke="#ffffff" stroke-width="3">
    <circle cx="130" cy="360" r="14" fill="#555f6b"/>
    <circle cx="318" cy="360" r="14" fill="#555f6b"/>
    <circle cx="506" cy="360" r="14" fill="#555f6b"/>
    <circle cx="694" cy="360" r="14" fill="#c45500"/>
    <circle cx="882" cy="360" r="14" fill="#555f6b"/>
    <circle cx="1070" cy="360" r="14" fill="#c45500"/>
  </g>

  <!-- Hito 1 (arriba) -->
  <rect x="40" y="120" width="180" height="180" rx="10" fill="#f1f3f5" stroke="#d5d9de"/>
  <text x="130" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#232f3e">1994–95</text>
  <text x="130" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Librería online</text>
  <g font-size="14" fill="#555f6b" text-anchor="middle">
    <text x="130" y="218">Jeff Bezos vende</text>
    <text x="130" y="238">libros por Internet</text>
    <text x="130" y="258">desde un garaje.</text>
  </g>

  <!-- Hito 2 (abajo) -->
  <rect x="228" y="420" width="180" height="180" rx="10" fill="#f1f3f5" stroke="#d5d9de"/>
  <text x="318" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#232f3e">2006</text>
  <text x="318" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Nace AWS</text>
  <g font-size="14" fill="#555f6b" text-anchor="middle">
    <text x="318" y="518">Vende a otras</text>
    <text x="318" y="538">empresas servidores</text>
    <text x="318" y="558">en la nube.</text>
  </g>

  <!-- Hito 3 (arriba) -->
  <rect x="416" y="120" width="180" height="180" rx="10" fill="#f1f3f5" stroke="#d5d9de"/>
  <text x="506" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#232f3e">2011–12</text>
  <text x="506" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Llega a España</text>
  <g font-size="14" fill="#555f6b" text-anchor="middle">
    <text x="506" y="218">Abre Amazon.es y su</text>
    <text x="506" y="238">primer centro logístico</text>
    <text x="506" y="258">en San Fernando</text>
    <text x="506" y="278">de Henares.</text>
  </g>

  <!-- Hito 4 (abajo, proceso) -->
  <rect x="604" y="420" width="180" height="180" rx="10" fill="#fff6ec" stroke="#c45500" stroke-width="2"/>
  <text x="694" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#c45500">2012</text>
  <text x="694" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Robots Kiva</text>
  <g font-size="14" fill="#555f6b" text-anchor="middle">
    <text x="694" y="518">Los robots llevan</text>
    <text x="694" y="538">las estanterías</text>
    <text x="694" y="558">al trabajador.</text>
  </g>

  <!-- Hito 5 (arriba) -->
  <rect x="792" y="120" width="180" height="180" rx="10" fill="#f1f3f5" stroke="#d5d9de"/>
  <text x="882" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#232f3e">2022</text>
  <text x="882" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">10 años de robots</text>
  <g font-size="14" fill="#555f6b" text-anchor="middle">
    <text x="882" y="218">Más de 520.000</text>
    <text x="882" y="238">unidades robóticas</text>
    <text x="882" y="258">en sus almacenes.</text>
  </g>

  <!-- Hito 6 (abajo, proceso) -->
  <rect x="980" y="420" width="180" height="180" rx="10" fill="#fff6ec" stroke="#c45500" stroke-width="2"/>
  <text x="1070" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#c45500">2025</text>
  <text x="1070" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">1 millón de robots</text>
  <g font-size="14" fill="#555f6b" text-anchor="middle">
    <text x="1070" y="518">La IA DeepFleet los</text>
    <text x="1070" y="538">coordina: un 10 %</text>
    <text x="1070" y="558">menos de recorrido.</text>
  </g>

  <!-- Leyenda -->
  <rect x="40" y="625" width="16" height="16" rx="3" fill="#fff6ec" stroke="#c45500" stroke-width="2"/>
  <text x="64" y="638" font-size="14" fill="#1f2933">Cambio en el proceso de preparar un pedido</text>
  <text x="1160" y="638" text-anchor="end" font-size="13" fill="#555f6b">Fuentes: aboutamazon.com y press.aboutamazon.com</text>
</svg>
